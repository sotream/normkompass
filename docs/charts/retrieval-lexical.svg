<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 407.0" width="640" role="img" aria-labelledby="title desc">
  <title id="title">Retrieval on lexical questions</title>
  <desc id="desc">Recall@5 and MRR of five search variants on 28 questions about exact terms, numbers and citation labels. The set favors lexical matching by construction and is not averaged with the paraphrase set.</desc>
