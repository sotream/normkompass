<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 361.0" width="640" role="img" aria-labelledby="title desc">
  <title id="title">Embedding models, same search</title>
  <desc id="desc">Recall@5 and MRR of four local embedding models in the older hybrid search on 75 paraphrase questions. No paired difference to the smallest model is significant.</desc>
  <style>
  .bg{fill:#ffffff}
  .t{fill:#1f2328;font:600 17px system-ui,sans-serif}
  .l{fill:#1f2328;font:13px system-ui,sans-serif}
  .lb{fill:#1f2328;font:600 13px system-ui,sans-serif}
  .n{fill:#59636e;font:12px system-ui,sans-serif}
  .axis{stroke:#d1d9e0;stroke-width:1}
  .whisker{stroke:#1f2328;stroke-width:1.5}
  .s0{fill:#2f6fb3}
  .s1{fill:#c2691a}
  .line{stroke:#8c959f;stroke-width:3;stroke-linecap:round}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .t,.l,.lb{fill:#e6edf3}
    .n{fill:#9198a1}
    .axis{stroke:#3d444d}
    .whisker{stroke:#e6edf3}
    .s0{fill:#6aa8e8}
    .s1{fill:#e7a35c}
    .line{stroke:#6e7681}
  }
</style>
