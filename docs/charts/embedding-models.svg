  <line class="axis" x1="250.0" y1="72.0" x2="250.0" y2="262.0"/>
  <line class="axis" x1="400.0" y1="72.0" x2="400.0" y2="262.0"/>
  <line class="axis" x1="550.0" y1="72.0" x2="550.0" y2="262.0"/>
  <text class="n" x="250.0" y="276.0" text-anchor="middle">0</text>
  <text class="n" x="400.0" y="276.0" text-anchor="middle">0.5</text>
  <text class="n" x="550.0" y="276.0" text-anchor="middle">1.0</text>
  <text class="n" x="20" y="300.0">No difference to multilingual-e5-small is significant (95% paired bootstrap), so the</text>
  <text class="n" x="20" y="317.0">smallest model is the default. Older hybrid search (Postgres full-text), 75 questions.</text>
  <text class="n" x="20" y="334.0">Whiskers: 95% bootstrap interval of the mean over questions. Source: eval/results/.</text>
</svg>
