  <text class="l" x="550.0" y="227.0">0.893</text>
  <rect class="s1" x="250.0" y="232.0" width="223.9" height="13" rx="2"/>
  <line class="whisker" x1="450.1" y1="238.5" x2="496.7" y2="238.5"/>
