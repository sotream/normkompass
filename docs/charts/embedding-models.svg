  <line class="whisker" x1="505.3" y1="188.5" x2="505.3" y2="196.5"/>
  <text class="l" x="517.3" y="197.0">0.779</text>
  <text class="l" x="20" y="228.0">bge-m3</text>
  <text class="l" x="20" y="244.0">(570 MB)</text>
