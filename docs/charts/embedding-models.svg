  <rect class="s0" x="20.0" y="46" width="12" height="12" rx="2"/>
  <text class="l" x="38.0" y="57">recall@5</text>
  <rect class="s1" x="170.0" y="46" width="12" height="12" rx="2"/>
  <text class="l" x="188.0" y="57">MRR</text>
  <text class="l" x="20" y="90.0">multilingual-e5-small</text>
  <text class="l" x="20" y="106.0">(default, 118 MB)</text>
  <rect class="s0" x="250.0" y="78.0" width="272.0" height="13" rx="2"/>
  <line class="whisker" x1="502.0" y1="84.5" x2="538.0" y2="84.5"/>
  <line class="whisker" x1="502.0" y1="80.5" x2="502.0" y2="88.5"/>
