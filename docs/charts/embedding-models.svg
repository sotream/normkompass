  <text class="l" x="509.1" y="105.0">0.748</text>
  <text class="l" x="20" y="136.0">multilingual-e5-base</text>
  <text class="l" x="20" y="152.0">(279 MB)</text>
  <rect class="s0" x="250.0" y="124.0" width="276.0" height="13" rx="2"/>
  <line class="whisker" x1="506.0" y1="130.5" x2="542.0" y2="130.5"/>
