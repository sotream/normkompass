name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: normkompass
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: normkompass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U normkompass -d normkompass"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://normkompass:ci-only-throwaway@localhost:5432/normkompass
      # The CI eval uses a fake embedder; skip the large GPU runtime download.
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm site:build
      - run: pnpm spec
        env:
          OPENSPEC_TELEMETRY: '0'
